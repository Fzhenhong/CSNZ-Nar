name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CSNZ-Nar.sln

      - name: Build
        run: dotnet build CSNZ-Nar.sln -c Release --no-restore -warnaserror

      - name: Publish GUI (single file)
        run: >
          dotnet publish src/NarGui/NarGui.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o artifacts/gui

      - name: Publish CLI (single file)
        run: >
          dotnet publish src/NarCli/NarCli.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o artifacts/cli

      - name: Assemble package
        shell: pwsh
        run: |
          $pkg = "artifacts/CSNZ-Nar-win-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item artifacts/gui/CSNZ-Nar.exe $pkg/
          Copy-Item artifacts/cli/nar.exe $pkg/
          Copy-Item README.md, LICENSE, CHANGELOG.md $pkg/
          # 中文名副本，方便直接在资源管理器里看到
          Copy-Item CHANGELOG.md "$pkg/更新记录.md"
          Copy-Item docs/使用说明.md $pkg/
          Compress-Archive -Path "$pkg/*" -DestinationPath "artifacts/CSNZ-Nar-win-x64.zip" -Force
          Get-ChildItem artifacts -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.zip' } |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CSNZ-Nar-win-x64
          path: |
            artifacts/CSNZ-Nar-win-x64.zip
            artifacts/gui/CSNZ-Nar.exe
            artifacts/cli/nar.exe
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $file = "release-notes/$tag.md"
          if (Test-Path $file) {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "使用 $file 作为 Release 正文"
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "未找到 $file，将使用默认模板" -ForegroundColor Yellow
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: CSNZ-Nar ${{ github.ref_name }}
          draft: false
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.found == 'true' && format('release-notes/{0}.md', github.ref_name) || '' }}
          files: |
            artifacts/CSNZ-Nar-win-x64.zip
